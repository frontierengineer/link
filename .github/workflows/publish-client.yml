name: Publish @frontierengineer/link-client

# Publish the link client to npm as a dual ESM+CJS package (prepack runs tsc for the
# ESM build + esbuild for the CJS bundle with @noble inlined / ws external).
#
# TRIGGER: push a tag `client-v<version>` that matches client/package.json "version"
# (e.g. client-v0.2.0), or run this workflow manually.
#
# AUTH: OIDC Trusted Publishing — NO token, nothing to rotate. GitHub mints a
# short-lived credential per run and npm verifies it came from this repo + workflow.
# ONE-TIME SETUP on npmjs.com: package @frontierengineer/link-client -> Settings ->
# Trusted Publisher -> GitHub Actions -> repository `frontierengineer/link`,
# workflow `publish-client.yml`. (No repo secret needed.)
on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: mint the short-lived npm publish credential (Trusted Publishing)
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run typecheck
      # `npm publish` runs prepack (build + build:cjs) and authenticates via OIDC —
      # no NPM_TOKEN. npm also records signed provenance automatically.
      - run: npm publish --access public
