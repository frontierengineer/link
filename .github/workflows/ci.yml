name: CI

# Run the Link SERVER test suite on every pull request and every push to master.
# This is the backward-compatibility gate: server/compat.test.ts freezes the v1
# wire protocol and asserts the current relay still accepts it end to end, so the
# relay can never drift incompatible. Frontier's deploy-link.yml runs this SAME
# suite right before a relay deploy, so an incompatible relay can't ship even via a
# manual deploy.
#
# NOTE: the client/ suite is intentionally NOT wired here yet. In a clean CI install
# it needs `ws` as a client devDependency (some tests spin up a real relay over raw
# ws frames), and a few idle-reaper unit tests are timing-flaky under load. Wiring
# it green is a follow-up; the backward-compat guarantee that gates deploys lives in
# the server suite here.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  server:
    name: server tests (incl. backward-compat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
