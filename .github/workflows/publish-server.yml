name: Publish @frontierengineer/link-server

# Publish the embeddable Link relay to npm. It is pure TypeScript (only ws + Node
# built-ins), so this is a plain tsc CJS build — no bundling.
#
# TRIGGER: push a tag `server-v<version>` matching server/package.json "version"
# (e.g. server-v0.1.0), or run manually.
#
# AUTH: OIDC Trusted Publishing — NO token, nothing to rotate. GitHub mints a
# short-lived credential per run and npm verifies it came from this repo + workflow.
# ONE-TIME SETUP on npmjs.com: package @frontierengineer/link-server -> Settings ->
# Trusted Publisher -> GitHub Actions -> repository `frontierengineer/link`,
# workflow `publish-server.yml`. (No repo secret needed.)
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: mint the short-lived npm publish credential (Trusted Publishing)
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: npm install
      # `npm publish` runs prepack (tsc build) and authenticates via OIDC — no token.
      - run: npm publish --access public
